apiVersion: 1

contactPoints:
  - orgId: 1
    name: n8n-webhook
    receivers:
      - uid: n8n-webhook
        type: webhook
        settings:
          url: http://n8n:5678/webhook/grafana-alert
          httpMethod: POST
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: n8n-webhook
    group_by: ['alertname', 'severity', 'error_type']
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 4h
